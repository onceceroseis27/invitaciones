/* css del scroll */
/* =========================
   CONTENEDOR GENERAL
========================= */
.timeline-section {
   display: flex;
  flex-direction: row;
  align-items: flex-start; /* que los hijos crezcan */
  height: auto;            /* 📌 no limitar la altura */
  overflow: visible;
  margin-bottom: 50px;     /* espacio hasta dress-code */
}

/* =========================
   COLUMNA IZQUIERDA
========================= */
.timeline-left {
  position: relative;
  width: 80px;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 18px;     /* mitad del círculo */
  padding-bottom: 18px;  /* mitad del círculo */
}

/* =========================
   BARRA
========================= */
.timeline-track {
  position: absolute;
  top: 18px;    /* mitad del círculo del primer stop */
  bottom: 18px; /* mitad del círculo del último stop */
  left: 50%;
  transform: translateX(-50%);
  width: 3px;
  background-color: #e0e0e0;
  border-radius: 10px;
}


.timeline-fill {
  position: absolute;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  width: 3px;
  height: 0;
  background-color: #b5c2a8;
  border-radius: 10px;
  transition: height 0.25s linear;
}

/* =========================
   PARADAS
========================= */
.timeline-stop {
  position: relative;
  margin: 100px 0;
  z-index: 2;
  display: flex;
  justify-content: center;
}

/* =========================
   CÍRCULO
========================= */
.circle {
  width: 36px;
  height: 36px;
  background-color: white;
  border: 2px solid #b5c2a8;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background-color 0.3s ease;
}

.timeline-stop.active .circle {
  background-color: #b5c2a8;
}

/* =========================
   CORAZÓN
========================= */
.heart-icon {
  font-size: 16px;
  color: black;
  transition: color 0.3s ease;
}

.timeline-stop.active .heart-icon {
  color: white;
}

/* =========================
   COLUMNA DERECHA
========================= */
.timeline-right {
  flex: 1;
  padding-left: 40px;
  min-height: 100%;
}

/* =========================
   AJUSTES FINALES
========================= */
.timeline-stop:first-child {
  margin-top: 0;
}

.timeline-stop:last-child {
  margin-bottom: 0;
}

/* Texto oculto por defecto */
.timeline-text {
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.4s ease, transform 0.4s ease;
}

/* Texto visible cuando su parada está activa */
.timeline-text.active {
  opacity: 1;
  transform: translateY(0);
}

<script>
function actualizarContador() {
  const fechaObjetivo = new Date("2027-06-11T17:00:00").getTime();
  const ahora = new Date().getTime();
  const diferencia = fechaObjetivo - ahora;

  if (diferencia <= 0) {
    document.getElementById("contador").innerHTML = "¡Es hoy!";
    return;
  }

  const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
  const horas = Math.floor((diferencia / (1000 * 60 * 60)) % 24);
  const minutos = Math.floor((diferencia / (1000 * 60)) % 60);
  const segundos = Math.floor((diferencia / 1000) % 60);

  document.getElementById("contador").innerHTML =
    `${dias}d ${horas}h ${minutos}m ${segundos}s`;
}

actualizarContador();
setInterval(actualizarContador, 1000);
</script>

<!-- SCRIPT SCROLL -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const stops = document.querySelectorAll(".timeline-stop");
  const track = document.querySelector(".timeline-track");
  const fill = document.querySelector(".timeline-fill");

  let trackTop = 0;
  let trackHeight = 0;

  function positionTrack() {
    const first = stops[0].querySelector(".circle").getBoundingClientRect();
    const last = stops[stops.length - 1].querySelector(".circle").getBoundingClientRect();
    const leftRect = track.parentElement.getBoundingClientRect();

    trackTop = first.top + first.height / 2 - leftRect.top;
    const bottom = last.top + last.height / 2 - leftRect.top;
    trackHeight = bottom - trackTop;

    track.style.top = trackTop + "px";
    track.style.height = trackHeight + "px";

    fill.style.top = trackTop + "px";
  }

  function updateTimeline() {
    const trackRect = track.getBoundingClientRect();
    const viewportCenter = window.innerHeight / 2;
    const texts = document.querySelectorAll(".timeline-text");

    // relleno continuo
    let fillHeight = viewportCenter - trackRect.top;
    fillHeight = Math.max(0, Math.min(fillHeight, trackRect.height));
    fill.style.height = fillHeight + "px";

    // activación de paradas
    stops.forEach(stop => {
      const circle = stop.querySelector(".circle");
      const rect = circle.getBoundingClientRect();
      const center = rect.top + rect.height / 2;

      if (center <= viewportCenter) {
        stop.classList.add("active");
      } else {
        stop.classList.remove("active");
      }

    stops.forEach((stop, index) => {
      const circle = stop.querySelector(".circle");
      const rect = circle.getBoundingClientRect();
      const center = rect.top + rect.height / 2;

      if (center <= viewportCenter) {
        stop.classList.add("active");
        texts[index]?.classList.add("active");
      } else {
        stop.classList.remove("active");
        texts[index]?.classList.remove("active");
      }
    });

    });
  }

  function updateAll() {
    positionTrack();
    updateTimeline();
  }

  window.addEventListener("scroll", updateTimeline);
  window.addEventListener("resize", updateAll);
  updateAll();
});
</script>


<!-- SCRIPT MUSICA -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const audio = document.getElementById("musicaBoda");
  const segundoInicio = 30; // Ajusta aquí el segundo donde quieres que empiece (o 0 para el inicio)

  let musicaIniciada = false;

  function reproducirAudio() {
    if (musicaIniciada) return;

    audio.currentTime = segundoInicio;
    
    // Intenta reproducir
    const playPromise = audio.play();

    if (playPromise !== undefined) {
      playPromise
        .then(() => {
          musicaIniciada = true;
          // Si logró sonar, removemos los escuchadores de eventos
          removerEventos();
        })
        .catch((error) => {
          // El móvil bloqueó el intento automático, esperará al gesto del usuario
          console.log("Esperando interacción del usuario para reproducir audio.");
        });
    }
  }

  function removerEventos() {
    document.removeEventListener("touchstart", reproducirAudio);
    document.removeEventListener("click", reproducirAudio);
    document.removeEventListener("scroll", reproducirAudio);
  }

  // 1. Intento de reproducción inmediata al cargar
  reproducirAudio();

  // 2. Escuchadores de respaldo para móviles (se activan al tocar o deslizar la pantalla)
  document.addEventListener("touchstart", reproducirAudio, { passive: true });
  document.addEventListener("click", reproducirAudio);
  document.addEventListener("scroll", reproducirAudio, { passive: true });
});
</script>
